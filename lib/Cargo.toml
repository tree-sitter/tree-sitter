[package]
name = "tree-sitter"
version.workspace = true
description = "Rust bindings to the Tree-sitter parsing library"
authors.workspace = true
edition.workspace = true
rust-version = "1.90"
readme = "binding_rust/README.md"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tree-sitter"
license.workspace = true
keywords.workspace = true
categories = [ "api-bindings", "external-ffi-bindings", "parsing", "text-editors" ]

build = "binding_rust/build.rs"
links = "tree-sitter"

include = [
  "/binding_rust/*",
  "/Cargo.toml",
  "/src/*.h",
  "/src/*.c",
  "/src/portable/*",
  "/src/unicode/*",
  "/src/wasm-stdlib/**/*",
  "/include/tree_sitter/api.h",
  "/LICENSE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]
targets = [ "x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu" ]

[lints]
workspace = true

[features]
default = [ "std" ]
std = [ "regex/std", "regex/perf" ]
wasm = [ "std", "wasmtime-c-api" ]
js-loader = [ "std", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:wasmparser" ]

[dependencies]
regex = { default-features = false, features = [ "unicode" ], version = "1.12.3" }
streaming-iterator = "0.1.9"
tree-sitter-language.workspace = true

[dependencies.wasmtime-c-api]
default-features = false
features = [ "cranelift", "gc", "gc-null" ]
optional = true
package = "wasmtime-c-api-impl"
version = "48.0.6"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasmparser = { version = "0.244.0", default-features = false, features = ["std"], optional = true }

[build-dependencies]
bindgen = { optional = true, version = "0.72.1" }
cc.workspace = true
serde_json.workspace = true

[dev-dependencies]
wasmparser = { version = "0.244.0", default-features = false, features = ["std", "validate", "features"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lib]
path = "binding_rust/lib.rs"
