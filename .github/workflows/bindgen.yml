name: Check Bindgen Output

on:
  pull_request:
    paths:
      - lib/include/tree_sitter/api.h
      - lib/binding_rust/bindings.rs
      - lib/src/*.def
      - crates/xtask/src/generate.rs
  push:
    branches: [master]
    paths:
      - lib/include/tree_sitter/api.h
      - lib/binding_rust/bindings.rs
      - lib/src/*.def
      - crates/xtask/src/generate.rs

jobs:
  check-bindgen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Generate bindings
        run: cargo xtask generate-bindings

      - name: Check if the generated files changed
        run: git diff --exit-code lib/binding_rust/bindings.rs lib/src/tree_sitter.def lib/src/tree_sitter_wasm.def
